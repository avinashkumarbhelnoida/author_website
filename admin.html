<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin — Avinash Kumar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --graphite:#15171B; --graphite-2:#1D2025; --bone:#E8E3D8;
    --bone-dim:#A6A296; --teal:#4FA39B; --rose:#C4586B; --line:#2B2E33;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--graphite); color:var(--bone);
       font-family:'Work Sans',system-ui,sans-serif;}
  .wrap{max-width:820px; margin:0 auto; padding:40px 20px;}
  h1{font-family:'Newsreader',serif; font-size:28px; margin:0 0 4px;}
  p.sub{color:var(--bone-dim); margin:0 0 32px; font-size:14px;}

  /* --- login --- */
  #login{max-width:360px; margin:80px auto; display:flex; flex-direction:column; gap:12px;}
  input, select, textarea{
    background:var(--graphite-2); border:1px solid var(--line); color:var(--bone);
    padding:10px 12px; border-radius:6px; font-size:14px; font-family:inherit;
  }
  textarea{min-height:80px; resize:vertical;}
  button{
    cursor:pointer; border:none; border-radius:6px; padding:10px 16px;
    font-size:14px; font-weight:600; font-family:inherit;
  }
  .btn-primary{background:var(--teal); color:#0B0F0E;}
  .btn-outline{background:transparent; border:1px solid var(--line); color:var(--bone);}
  .btn-danger{background:transparent; border:1px solid var(--rose); color:var(--rose);}
  #error{color:var(--rose); font-size:13px; min-height:16px;}

  /* --- app --- */
  #app{display:none;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;}

  .book-form{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
    background:var(--graphite-2); border:1px solid var(--line); border-radius:10px;
    padding:20px; margin-bottom:32px;
  }
  .book-form .full{grid-column:1 / -1;}
  .book-form label{font-size:12px; color:var(--bone-dim); display:block; margin-bottom:4px;}

  table{width:100%; border-collapse:collapse; font-size:14px;}
  th,td{text-align:left; padding:10px 8px; border-bottom:1px solid var(--line);}
  th{color:var(--bone-dim); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.04em;}
  .status-pill{padding:2px 8px; border-radius:20px; font-size:11px;}
  .status-available{background:rgba(79,163,155,.15); color:var(--teal);}
  .status-coming_soon{background:rgba(196,88,107,.15); color:var(--rose);}
  .row-actions{display:flex; gap:8px;}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="login">
    <h1>Admin</h1>
    <p class="sub">Sign in to manage books on authoravinashkumar.com</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn-primary" onclick="signIn()">Sign in</button>
    <div id="error"></div>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="topbar">
      <div>
        <h1>Book manager</h1>
        <p class="sub" style="margin:0;">Signed in as <span id="who"></span></p>
      </div>
      <button class="btn-outline" onclick="signOut()">Sign out</button>
    </div>

    <form class="book-form" onsubmit="saveBook(event)">
      <input type="hidden" id="book-id">
      <div>
        <label>Title</label>
        <input id="f-title" required>
      </div>
      <div>
        <label>Slug (url-safe id)</label>
        <input id="f-slug" required placeholder="e.g. invisible-threads">
      </div>
      <div>
        <label>Genres (comma separated)</label>
        <input id="f-genres" placeholder="psychological-thriller, mystery">
      </div>
      <div>
        <label>Status</label>
        <select id="f-status">
          <option value="coming_soon">Coming Soon</option>
          <option value="available">Available</option>
        </select>
      </div>
      <div>
        <label>Price (USD, optional)</label>
        <input id="f-price" type="number" step="0.01">
      </div>
      <div>
        <label>Book page filename (optional)</label>
        <input id="f-page" placeholder="e.g. invisible-threads.html">
      </div>
      <div class="full">
        <label>Front cover URL</label>
        <input id="f-front" placeholder="Paste Supabase Storage public URL">
      </div>
      <div class="full">
        <label>Full wraparound cover URL</label>
        <input id="f-full" placeholder="Paste Supabase Storage public URL">
      </div>
      <div class="full">
        <label>Blurb</label>
        <textarea id="f-blurb"></textarea>
      </div>
      <div class="full" style="display:flex; gap:8px;">
        <button class="btn-primary" type="submit">Save book</button>
        <button class="btn-outline" type="button" onclick="resetForm()">Clear form</button>
      </div>
    </form>

    <table>
      <thead>
        <tr><th>Title</th><th>Status</th><th>Price</th><th></th></tr>
      </thead>
      <tbody id="book-rows"></tbody>
    </table>
  </div>
</div>

<script>
  // ---- fill these in from your Supabase project settings ----
  const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR-PUBLIC-ANON-KEY";
  // -------------------------------------------------------------

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function signIn(){
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { document.getElementById('error').textContent = error.message; return; }
    showApp();
  }

  async function signOut(){
    await sb.auth.signOut();
    document.getElementById('app').style.display = 'none';
    document.getElementById('login').style.display = 'flex';
  }

  async function showApp(){
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return;
    document.getElementById('who').textContent = user.email;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadBooks();
  }

  async function loadBooks(){
    const { data, error } = await sb.from('books').select('*').order('sort_order');
    if (error) { alert(error.message); return; }
    const rows = document.getElementById('book-rows');
    rows.innerHTML = '';
    data.forEach(b => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${b.title}</td>
        <td><span class="status-pill status-${b.status}">${b.status === 'available' ? 'Available' : 'Coming Soon'}</span></td>
        <td>${b.price ? '$' + b.price : '—'}</td>
        <td class="row-actions">
          <button class="btn-outline" onclick='editBook(${JSON.stringify(b)})'>Edit</button>
          <button class="btn-danger" onclick="deleteBook('${b.id}')">Delete</button>
        </td>`;
      rows.appendChild(tr);
    });
  }

  function editBook(b){
    document.getElementById('book-id').value = b.id;
    document.getElementById('f-title').value = b.title || '';
    document.getElementById('f-slug').value = b.slug || '';
    document.getElementById('f-genres').value = (b.genres || []).join(', ');
    document.getElementById('f-status').value = b.status || 'coming_soon';
    document.getElementById('f-price').value = b.price || '';
    document.getElementById('f-page').value = b.book_page_slug || '';
    document.getElementById('f-front').value = b.front_cover_url || '';
    document.getElementById('f-full').value = b.full_cover_url || '';
    document.getElementById('f-blurb').value = b.blurb || '';
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function resetForm(){
    document.getElementById('book-id').value = '';
    ['f-title','f-slug','f-genres','f-price','f-page','f-front','f-full','f-blurb']
      .forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-status').value = 'coming_soon';
  }

  async function saveBook(e){
    e.preventDefault();
    const id = document.getElementById('book-id').value;
    const payload = {
      title: document.getElementById('f-title').value,
      slug: document.getElementById('f-slug').value,
      genres: document.getElementById('f-genres').value
                .split(',').map(g => g.trim()).filter(Boolean),
      status: document.getElementById('f-status').value,
      price: document.getElementById('f-price').value || null,
      book_page_slug: document.getElementById('f-page').value || null,
      front_cover_url: document.getElementById('f-front').value || null,
      full_cover_url: document.getElementById('f-full').value || null,
      blurb: document.getElementById('f-blurb').value || null,
    };
    const { error } = id
      ? await sb.from('books').update(payload).eq('id', id)
      : await sb.from('books').insert(payload);
    if (error) { alert(error.message); return; }
    resetForm();
    loadBooks();
  }

  async function deleteBook(id){
    if (!confirm('Delete this book?')) return;
    const { error } = await sb.from('books').delete().eq('id', id);
    if (error) { alert(error.message); return; }
    loadBooks();
  }

  // Restore session on page load
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) showApp();
  });
</script>
</body>
</html>
