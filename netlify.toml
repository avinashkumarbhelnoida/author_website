[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Keep the digital book files completely unreachable by direct URL guessing —
# this is belt-and-suspenders on top of the private Supabase bucket, in case
# anyone ever drops a file into a local /digital-books folder by mistake.
[[headers]]
  for = "/digital-books/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/digital-books/*"
  to = "/404.html"
  status = 404
  force = true
