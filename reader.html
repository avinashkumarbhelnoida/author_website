<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>Reader — Avinash Kumar</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/logo/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/logo/logo-192.png">
<link rel="apple-touch-icon" href="/images/logo/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --graphite:#15171B; --graphite-2:#1D2025; --bone:#E8E3D8; --bone-dim:#A6A296;
    --ghost-teal:#4FA39B; --ghost-rose:#C4586B; --line:rgba(232,227,216,0.14);
    --serif:'Newsreader', Georgia, serif; --sans:'Work Sans', Arial, sans-serif; --mono:'IBM Plex Mono', monospace;
    --bar-h:60px; --foot-h:52px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--graphite); color:var(--bone); font:14px/1.5 var(--sans); overflow:hidden;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  button{font:inherit; cursor:pointer;}
  .hidden{display:none !important;}

  /* ---------- top bar ---------- */
  .bar{
    position:fixed; top:0; left:0; right:0; height:var(--bar-h); z-index:20; background:#000;
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; padding:0 18px;
  }
  .back{flex:none; font:11px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ghost-teal); text-decoration:none; white-space:nowrap;}
  .back:hover{color:var(--bone);}
  .title-block{flex:1; min-width:0; text-align:center;}
  .title-block h1{margin:0; font:italic 400 17px/1.2 var(--serif); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .title-block .sub{font:10px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--bone-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tools{flex:none; display:flex; align-items:center; gap:6px;}
  .tool{
    height:34px; min-width:34px; padding:0 10px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:transparent; border:1px solid var(--line); color:var(--bone-dim); font:11px var(--mono); letter-spacing:.06em; text-transform:uppercase;
  }
  .tool:hover, .tool[aria-pressed="true"]{color:var(--ghost-teal); border-color:var(--ghost-teal);}
  .tool:disabled{opacity:.4; cursor:default;}
  .tool svg{width:16px; height:16px;}
  .zoom{display:inline-flex; align-items:center; border:1px solid var(--line);}
  .zoom .tool{border:0;}
  .zoom span{font:11px var(--mono); color:var(--bone-dim); min-width:44px; text-align:center;}

  /* ---------- pages ---------- */
  .viewer{
    position:fixed; top:var(--bar-h); bottom:var(--foot-h); left:0; right:0; overflow:auto;
    -webkit-overflow-scrolling:touch; padding:24px 0 40px; transition:background .2s;
  }
  .page{position:relative; margin:0 auto 18px; background:#fff; box-shadow:0 12px 30px -12px rgba(0,0,0,.6);}
  .page canvas{display:block; width:100%; height:100%; pointer-events:none;}
  /* reader's name across every page — discourages sharing screenshots */
  .page .wm{position:absolute; inset:0; pointer-events:none; background-repeat:repeat; opacity:.9;}

  .viewer.t-paper{background:var(--graphite);}
  .viewer.t-sepia{background:#2a251d;}
  .viewer.t-sepia .page{background:#f3e8d0;}
  .viewer.t-sepia canvas{filter:sepia(.45) brightness(.96) contrast(.98); mix-blend-mode:multiply;}
  .viewer.t-night{background:#0b0c0e;}
  .viewer.t-night .page{background:#1a1b1e;}
  .viewer.t-night canvas{filter:invert(.9) hue-rotate(180deg);}
  .viewer.t-night .page .wm{filter:invert(1);}

  /* ---------- bottom bar ---------- */
  .foot{
    position:fixed; left:0; right:0; bottom:0; height:var(--foot-h); z-index:20; background:#000; border-top:1px solid var(--line);
    display:flex; align-items:center; gap:16px; padding:0 18px; font:11px var(--mono); color:var(--bone-dim); letter-spacing:.04em;
  }
  .foot .track{flex:1; height:3px; background:#383b3f; position:relative; cursor:pointer;}
  .foot .track span{position:absolute; left:0; top:0; bottom:0; background:var(--ghost-teal); width:0;}
  .foot .track:hover{height:5px;}
  .foot input{width:52px; background:var(--graphite-2); border:1px solid var(--line); color:var(--bone); font:11px var(--mono); padding:4px 6px; text-align:center;}
  .foot .chapter{max-width:28vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--bone);}

  /* ---------- contents / bookmarks panel ---------- */
  .panel{
    position:fixed; top:var(--bar-h); bottom:var(--foot-h); left:0; width:min(340px, 88vw); z-index:25;
    background:var(--graphite-2); border-right:1px solid var(--line); transform:translateX(-102%); transition:transform .22s ease;
    display:flex; flex-direction:column; box-shadow:20px 0 40px -20px rgba(0,0,0,.7);
  }
  .panel.open{transform:none;}
  .ptabs{display:flex; border-bottom:1px solid var(--line);}
  .ptab{flex:1; background:none; border:0; border-bottom:2px solid transparent; padding:14px 0 12px; color:var(--bone-dim);
    font:11px var(--mono); letter-spacing:.1em; text-transform:uppercase;}
  .ptab.active{color:var(--bone); border-color:var(--ghost-teal);}
  .plist{flex:1; overflow:auto; padding:8px 0;}
  .pitem{display:flex; align-items:baseline; gap:10px; width:100%; background:none; border:0; text-align:left;
    padding:10px 20px; color:var(--bone); font:15px/1.35 var(--serif);}
  .pitem:hover{background:rgba(232,227,216,.05); color:var(--ghost-teal);}
  .pitem.sub{padding-left:36px; font-size:14px; color:var(--bone-dim);}
  .pitem.current{color:var(--ghost-teal);}
  .pitem .label{flex:1;}
  .pitem .pg{font:10px var(--mono); color:var(--bone-dim); flex:none;}
  .pitem .rm{flex:none; background:none; border:0; color:var(--bone-dim); font-size:16px; padding:0 2px;}
  .pitem .rm:hover{color:var(--ghost-rose);}
  .pempty{padding:18px 20px; color:var(--bone-dim); font-size:13px;}
  .scrim{position:fixed; inset:0; z-index:24; background:rgba(0,0,0,.35);}

  /* ---------- theme menu ---------- */
  .menu{position:fixed; top:calc(var(--bar-h) + 6px); right:18px; z-index:26; background:var(--graphite-2); border:1px solid var(--line);
    padding:6px 0; min-width:170px; box-shadow:0 18px 36px -12px rgba(0,0,0,.6);}
  .menu button{display:flex; align-items:center; gap:10px; width:100%; background:none; border:0; padding:9px 16px; color:var(--bone-dim); font-size:13px; text-align:left;}
  .menu button:hover{color:var(--bone); background:rgba(232,227,216,.05);}
  .menu button[aria-checked="true"]{color:var(--ghost-teal);}
  .swatch{width:14px; height:14px; border:1px solid var(--line);}

  /* ---------- states + toast ---------- */
  .state{position:fixed; inset:var(--bar-h) 0 0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:30px 20px;}
  .state h2{margin:0; font:400 26px var(--serif);}
  .state p{margin:0; max-width:400px; color:var(--bone-dim);}
  .btn{display:inline-block; padding:11px 18px; border:1px solid var(--bone); background:var(--bone); color:var(--graphite);
    font:11px var(--mono); letter-spacing:.08em; text-transform:uppercase; text-decoration:none;}
  .btn:hover{background:transparent; color:var(--bone);}
  .spinner{width:28px; height:28px; border:2px solid var(--line); border-top-color:var(--ghost-teal); border-radius:50%; animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .toast{position:fixed; left:50%; bottom:calc(var(--foot-h) + 16px); transform:translateX(-50%); z-index:30;
    background:#000; border:1px solid var(--ghost-teal); color:var(--bone); padding:9px 16px; font:12px var(--mono); letter-spacing:.04em;
    opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap;}
  .toast.show{opacity:1;}

  @media (max-width:700px){
    :root{--bar-h:56px;}
    .bar{padding:0 10px; gap:8px;}
    .back .txt, .title-block .sub, .zoom span, .tool .txt{display:none;}
    .tool{padding:0 8px;}
    .foot{gap:10px; padding:0 12px;}
    .foot .chapter{display:none;}
  }

  /* No printing the book */
  @media print{
    body *{display:none !important;}
    body::after{content:"Printing is not available for Digital Editions."; display:block; padding:40px; font:16px sans-serif;}
  }
</style>
</head>
<body>

<header class="bar">
  <a class="back" href="my-library.html">← <span class="txt">My Library</span></a>
  <div class="title-block">
    <h1 id="readerTitle">Opening…</h1>
    <div class="sub" id="readerSub"></div>
  </div>
  <div class="tools hidden" id="tools">
    <button class="tool" id="contentsBtn" type="button" aria-label="Contents and bookmarks" title="Contents &amp; bookmarks">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 4h12M2 8h12M2 12h8"/></svg><span class="txt">Contents</span>
    </button>
    <button class="tool" id="bookmarkBtn" type="button" aria-pressed="false" aria-label="Bookmark this page" title="Bookmark this page">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 2h8v12l-4-3-4 3z"/></svg>
    </button>
    <button class="tool" id="themeBtn" type="button" aria-label="Reading theme" title="Reading theme" aria-haspopup="true">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg>
    </button>
    <div class="zoom">
      <button class="tool" id="zoomOut" type="button" aria-label="Zoom out">−</button>
      <span id="zoomLabel">100%</span>
      <button class="tool" id="zoomIn" type="button" aria-label="Zoom in">+</button>
    </div>
  </div>
</header>

<div class="state" id="state"><div class="spinner"></div><p>Checking your library…</p></div>

<main class="viewer t-paper hidden" id="viewer" tabindex="-1"></main>

<footer class="foot hidden" id="foot">
  <span class="chapter" id="chapterName"></span>
  <div class="track" id="track" title="Jump to position"><span id="trackFill"></span></div>
  <span>Page <input id="pageInput" inputmode="numeric" aria-label="Page number"> of <span id="pageTotal">–</span></span>
  <span id="pct">0%</span>
</footer>

<div class="scrim hidden" id="scrim"></div>
<aside class="panel" id="panel" aria-label="Contents and bookmarks">
  <div class="ptabs">
    <button class="ptab active" type="button" data-tab="contents">Contents</button>
    <button class="ptab" type="button" data-tab="bookmarks">Bookmarks</button>
  </div>
  <div class="plist" id="contentsList"></div>
  <div class="plist hidden" id="bookmarksList"></div>
</aside>

<div class="menu hidden" id="themeMenu" role="menu">
  <button type="button" role="menuitemradio" data-theme="paper"><span class="swatch" style="background:#fff"></span>Paper</button>
  <button type="button" role="menuitemradio" data-theme="sepia"><span class="swatch" style="background:#f3e8d0"></span>Sepia</button>
  <button type="button" role="menuitemradio" data-theme="night"><span class="swatch" style="background:#1a1b1e"></span>Night</button>
</div>

<div class="toast" id="toast"></div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const $ = id => document.getElementById(id);
  const viewer = $('viewer');
  const slug = new URLSearchParams(location.search).get('book') || 'invisible-threads';

  // Per-viewer display preferences (convenience only — fine if storage is blocked)
  const pref = {
    get(k, d){ try { return localStorage.getItem('akReader.' + k) ?? d; } catch { return d; } },
    set(k, v){ try { localStorage.setItem('akReader.' + k, v); } catch {} },
  };

  let pdf, user, bookId, base;               // base = page-1 size at scale 1
  let pages = [];                            // [{el, canvas, task, rendered}]
  let scale = 1, zoom = Number(pref.get('zoom', 1)) || 1;
  let current = 1, chapters = [], bookmarks = [], bookmarksOn = true;

  function showState(html){
    $('state').innerHTML = html;
    $('state').classList.remove('hidden');
    ['viewer', 'foot', 'tools'].forEach(id => $(id).classList.add('hidden'));
  }
  let toastTimer;
  function toast(msg){
    $('toast').textContent = msg;
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2400);
  }

  // ---------- open the book ----------
  async function openBook(){
    const session = await akGetSession();
    if (!session) {
      $('readerTitle').textContent = 'Sign in required';
      showState(`<h2>Please sign in to read</h2><p>Your Digital Editions open from your library once you're signed in.</p>
        <a class="btn" href="my-library.html#signin">Sign in</a>`);
      return;
    }
    user = session.user;

    let data;
    try {
      // The server re-checks that this book is in the reader's library before
      // it returns a link to the private file. The link expires in 2 minutes,
      // so the whole file is fetched once, straight away, and never shown.
      data = await akCallFunction('get-read-url', { bookSlug: slug });
    } catch (e) {
      $('readerTitle').textContent = 'Not in your library';
      showState(`<h2>This Digital Edition is not in your library</h2><p></p><a class="btn" href="index.html#shelf">Explore books</a>`);
      $('state').querySelector('p').textContent = e.message || 'Please purchase access to read this book.';
      return;
    }

    bookId = data.bookId;
    $('readerTitle').textContent = data.title;
    $('readerSub').textContent = data.subtitle || '';
    document.title = `${data.title} — Avinash Kumar`;
    showState('<div class="spinner"></div><p>Opening your book…</p>');

    try {
      const res = await fetch(data.url);
      if (!res.ok) throw new Error('download failed');
      pdf = await pdfjsLib.getDocument({ data: await res.arrayBuffer() }).promise;
    } catch (e) {
      console.error(e);
      showState('<h2>We couldn\'t open this book</h2><p>Please check your connection and try again.</p><a class="btn" href="">Try again</a>');
      return;
    }

    const [progress] = await Promise.all([loadProgress(), loadChapters(), loadBookmarks()]);

    $('state').classList.add('hidden');
    ['viewer', 'foot', 'tools'].forEach(id => $(id).classList.remove('hidden'));
    $('pageTotal').textContent = pdf.numPages;
    setWatermark(data.readerName || user.email);
    applyTheme(pref.get('theme', 'paper'));

    const first = await pdf.getPage(1);
    const vp = first.getViewport({ scale: 1 });
    base = { w: vp.width, h: vp.height };
    buildPages();
    layout();

    const resumeAt = Number(new URLSearchParams(location.search).get('page')) || progress;
    if (resumeAt > 1 && resumeAt <= pdf.numPages) {
      goTo(resumeAt, false);
      toast(`Welcome back — resuming at page ${resumeAt}`);
    }
    updatePosition();
    viewer.focus();
  }

  // ---------- pages: placeholders, rendered lazily near the viewport ----------
  function buildPages(){
    const frag = document.createDocumentFragment();
    for (let i = 1; i <= pdf.numPages; i++) {
      const el = document.createElement('div');
      el.className = 'page';
      el.dataset.page = i;
      el.innerHTML = '<div class="wm"></div>';
      frag.appendChild(el);
      pages[i] = { el, canvas: null, task: null, rendered: 0, busy: false, gen: 0 };
    }
    viewer.appendChild(frag);
    const io = new IntersectionObserver(entries => entries.forEach(en => {
      const n = Number(en.target.dataset.page);
      if (en.isIntersecting) renderPage(n); else releasePage(n);
    }), { root: viewer, rootMargin: '150% 0px' });
    pages.forEach(p => p && io.observe(p.el));
  }

  function layout(){
    const avail = Math.min(viewer.clientWidth - 24, 780);
    scale = (avail / base.w) * zoom;
    $('zoomLabel').textContent = Math.round(zoom * 100) + '%';
    pages.forEach((p, i) => {
      if (!p) return;
      const w = (p.w || base.w) * scale, h = (p.h || base.h) * scale;
      p.el.style.width = w + 'px';
      p.el.style.height = h + 'px';
      if (p.rendered && p.rendered !== scale) { releasePage(i); renderPage(i); }
    });
  }

  async function renderPage(n){
    const p = pages[n];
    if (p.rendered === scale || p.busy) return;
    p.busy = true;
    const gen = ++p.gen, s = scale;      // gen changes if the page is released meanwhile
    try {
      const page = await pdf.getPage(n);
      if (gen !== p.gen) return;
      const vp1 = page.getViewport({ scale: 1 });
      if (!p.w) { p.w = vp1.width; p.h = vp1.height; p.el.style.width = p.w * scale + 'px'; p.el.style.height = p.h * scale + 'px'; }
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const vp = page.getViewport({ scale: s * dpr });
      const canvas = document.createElement('canvas');
      canvas.width = Math.floor(vp.width);
      canvas.height = Math.floor(vp.height);
      p.task = page.render({ canvasContext: canvas.getContext('2d'), viewport: vp });
      await p.task.promise;
      if (gen !== p.gen) return;
      if (p.canvas) p.canvas.remove();
      p.el.prepend(canvas);
      p.canvas = canvas;
      p.rendered = s;
    } catch (e) { /* cancelled */ }
    finally { if (gen === p.gen) { p.busy = false; p.task = null; } }
    if (gen === p.gen && p.rendered !== scale) renderPage(n);   // zoom changed while drawing
  }

  function releasePage(n){
    const p = pages[n];
    p.gen++;
    p.busy = false;
    if (p.task) { p.task.cancel(); p.task = null; }
    if (p.canvas) { p.canvas.width = p.canvas.height = 0; p.canvas.remove(); p.canvas = null; }
    p.rendered = 0;
  }

  function setWatermark(name){
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    const text = esc(`Licensed to ${name}`);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240"><text x="180" y="120" text-anchor="middle"
      transform="rotate(-28 180 120)" font-family="monospace" font-size="13" fill="rgba(80,80,80,0.10)">${text}</text></svg>`;
    const url = `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
    const style = document.createElement('style');
    style.textContent = `.page .wm{background-image:${url};}`;
    document.head.appendChild(style);
  }

  // ---------- position, navigation ----------
  function pageAtScroll(){
    const mid = viewer.scrollTop + viewer.clientHeight * 0.35;
    let lo = 1, hi = pdf.numPages;
    while (lo < hi) {
      const m = (lo + hi + 1) >> 1;
      if (pages[m].el.offsetTop <= mid) lo = m; else hi = m - 1;
    }
    return lo;
  }

  function goTo(n, smooth = true){
    n = Math.max(1, Math.min(pdf.numPages, n));
    viewer.scrollTo({ top: pages[n].el.offsetTop - 12, behavior: smooth ? 'smooth' : 'auto' });
    current = n;
    updateFooter();
  }

  function chapterFor(n){
    let name = '';
    for (const c of chapters) { if (c.page <= n) name = c.title; else break; }
    return name;
  }

  function updateFooter(){
    const pct = Math.round(current / pdf.numPages * 100);
    if (document.activeElement !== $('pageInput')) $('pageInput').value = current;
    $('pct').textContent = pct + '%';
    $('trackFill').style.width = pct + '%';
    $('chapterName').textContent = chapterFor(current);
    $('bookmarkBtn').setAttribute('aria-pressed', bookmarks.some(b => b.page === current) ? 'true' : 'false');
    document.querySelectorAll('#contentsList .pitem').forEach(el => {
      el.classList.toggle('current', el.dataset.page && chapterFor(current) === el.dataset.title);
    });
  }

  let ticking = false;
  function updatePosition(){
    ticking = false;
    const n = pageAtScroll();
    if (n !== current) { current = n; saveProgressSoon(); }
    updateFooter();
  }
  viewer.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(updatePosition); } }, { passive: true });

  $('pageInput').addEventListener('change', e => goTo(parseInt(e.target.value, 10) || current));
  $('pageInput').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
  $('track').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect();
    goTo(Math.ceil((e.clientX - r.left) / r.width * pdf.numPages), false);
  });

  function setZoom(z){
    const keep = current, frac = (viewer.scrollTop - pages[keep].el.offsetTop) / pages[keep].el.offsetHeight;
    zoom = Math.max(0.5, Math.min(2.5, Math.round(z * 10) / 10));
    pref.set('zoom', zoom);
    layout();
    viewer.scrollTop = pages[keep].el.offsetTop + frac * pages[keep].el.offsetHeight;
  }
  $('zoomIn').onclick = () => setZoom(zoom + 0.1);
  $('zoomOut').onclick = () => setZoom(zoom - 0.1);
  let resizeTimer;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => pdf && setZoom(zoom), 150); });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && ['p', 's'].includes(e.key.toLowerCase())) { e.preventDefault(); toast('Printing and saving are not available'); return; }
    if (!pdf || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') goTo(current + 1);
    else if (e.key === 'ArrowLeft') goTo(current - 1);
    else if (e.key === 'Escape') { closePanel(); $('themeMenu').classList.add('hidden'); }
  });
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('copy', e => e.preventDefault());

  // ---------- reading progress (Supabase reading_progress, own rows only via RLS) ----------
  async function loadProgress(){
    const { data } = await sb.from('reading_progress').select('page_or_section')
      .eq('user_id', user.id).eq('book_id', bookId).maybeSingle();
    const m = data && /(\d+)/.exec(data.page_or_section || '');
    return m ? Number(m[1]) : 1;
  }

  let saveTimer, lastSaved = 0;
  function saveProgressSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveProgress, 1500); }
  async function saveProgress(){
    clearTimeout(saveTimer);
    if (!pdf || current === lastSaved) return;
    lastSaved = current;
    const { error } = await sb.from('reading_progress').upsert({
      user_id: user.id,
      book_id: bookId,
      chapter: chapterFor(current) || null,
      page_or_section: `Page ${current}`,
      progress_percentage: Math.round(current / pdf.numPages * 10000) / 100,
      last_read_at: new Date().toISOString(),
    }, { onConflict: 'user_id,book_id' });
    if (error) { console.error(error); lastSaved = 0; }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveProgress(); });
  window.addEventListener('pagehide', saveProgress);

  // ---------- contents (the PDF's own outline) ----------
  async function loadChapters(){
    const outline = await pdf.getOutline().catch(() => null);
    const list = $('contentsList');
    if (!outline || !outline.length) {
      list.innerHTML = '<p class="pempty">This edition has no chapter list. Use the page box at the bottom to jump to a page.</p>';
      return;
    }
    const items = [];
    async function walk(nodes, depth){
      for (const node of nodes) {
        let page = null;
        try {
          const dest = typeof node.dest === 'string' ? await pdf.getDestination(node.dest) : node.dest;
          if (dest) page = (await pdf.getPageIndex(dest[0])) + 1;
        } catch {}
        if (page) items.push({ title: node.title, page, depth });
        if (depth < 1 && node.items?.length) await walk(node.items, depth + 1);
      }
    }
    await walk(outline, 0);
    chapters = items.slice().sort((a, b) => a.page - b.page);
    list.innerHTML = '';
    items.forEach(it => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pitem' + (it.depth ? ' sub' : '');
      b.dataset.page = it.page;
      b.dataset.title = it.title;
      b.innerHTML = '<span class="label"></span><span class="pg"></span>';
      b.querySelector('.label').textContent = it.title;
      b.querySelector('.pg').textContent = it.page;
      b.onclick = () => { goTo(it.page, false); closePanel(); };
      list.appendChild(b);
    });
  }

  // ---------- bookmarks (Supabase reader_bookmarks, own rows only via RLS) ----------
  async function loadBookmarks(){
    const { data, error } = await sb.from('reader_bookmarks').select('page, label')
      .eq('user_id', user.id).eq('book_id', bookId).order('page');
    if (error) {          // table not created yet (schema-v4-reader.sql)
      bookmarksOn = false;
      $('bookmarkBtn').disabled = true;
      $('bookmarkBtn').title = 'Bookmarks are not available yet';
      console.warn('Bookmarks unavailable:', error.message);
    }
    bookmarks = data || [];
    renderBookmarks();
  }

  function renderBookmarks(){
    const list = $('bookmarksList');
    list.innerHTML = '';
    if (!bookmarks.length) {
      list.innerHTML = `<p class="pempty">${bookmarksOn ? 'No bookmarks yet. Tap the bookmark icon at the top to mark the page you\'re on.' : 'Bookmarks are not available yet.'}</p>`;
      return;
    }
    bookmarks.forEach(bm => {
      const row = document.createElement('div');
      row.className = 'pitem';
      row.innerHTML = '<span class="pg"></span><span class="label"></span><button class="rm" type="button" aria-label="Remove bookmark">×</button>';
      row.querySelector('.pg').textContent = 'p. ' + bm.page;
      row.querySelector('.label').textContent = bm.label || `Page ${bm.page}`;
      row.style.cursor = 'pointer';
      row.onclick = () => { goTo(bm.page, false); closePanel(); };
      row.querySelector('.rm').onclick = e => { e.stopPropagation(); toggleBookmark(bm.page); };
      list.appendChild(row);
    });
  }

  async function toggleBookmark(page){
    if (!bookmarksOn) return;
    const exists = bookmarks.some(b => b.page === page);
    const q = sb.from('reader_bookmarks');
    const { error } = exists
      ? await q.delete().eq('user_id', user.id).eq('book_id', bookId).eq('page', page)
      : await q.insert({ user_id: user.id, book_id: bookId, page, label: chapterFor(page) || null });
    if (error) { toast('Could not update bookmark'); console.error(error); return; }
    bookmarks = exists ? bookmarks.filter(b => b.page !== page)
      : [...bookmarks, { page, label: chapterFor(page) || null }].sort((a, b) => a.page - b.page);
    renderBookmarks();
    updateFooter();
    toast(exists ? `Bookmark removed · page ${page}` : `Bookmarked page ${page}`);
  }
  $('bookmarkBtn').onclick = () => toggleBookmark(current);

  // ---------- panel + theme menu ----------
  function openPanel(){ $('panel').classList.add('open'); $('scrim').classList.remove('hidden'); $('contentsBtn').setAttribute('aria-pressed', 'true'); }
  function closePanel(){ $('panel').classList.remove('open'); $('scrim').classList.add('hidden'); $('contentsBtn').setAttribute('aria-pressed', 'false'); }
  $('contentsBtn').onclick = () => $('panel').classList.contains('open') ? closePanel() : openPanel();
  $('scrim').onclick = closePanel;
  document.querySelectorAll('.ptab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.ptab').forEach(x => x.classList.toggle('active', x === t));
    $('contentsList').classList.toggle('hidden', t.dataset.tab !== 'contents');
    $('bookmarksList').classList.toggle('hidden', t.dataset.tab !== 'bookmarks');
  });

  function applyTheme(t){
    if (!['paper', 'sepia', 'night'].includes(t)) t = 'paper';
    viewer.classList.remove('t-paper', 't-sepia', 't-night');
    viewer.classList.add('t-' + t);
    document.querySelectorAll('#themeMenu button').forEach(b => b.setAttribute('aria-checked', b.dataset.theme === t ? 'true' : 'false'));
    pref.set('theme', t);
  }
  $('themeBtn').onclick = e => { e.stopPropagation(); $('themeMenu').classList.toggle('hidden'); };
  document.querySelectorAll('#themeMenu button').forEach(b => b.onclick = () => { applyTheme(b.dataset.theme); $('themeMenu').classList.add('hidden'); });
  document.addEventListener('click', e => { if (!$('themeMenu').contains(e.target)) $('themeMenu').classList.add('hidden'); });

  openBook();
</script>
